name: Run Pest Tests on MySQL 8.0

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ticaret_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: pdo_mysql, bcmath, ctype, fileinfo, json, mbstring, openssl, tokenizer, xml
        coverage: none

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Copy .env
      run: cp .env.example .env

    - name: Generate key
      run: php artisan key:generate

    - name: Configure Testing Environment for MySQL
      run: |
        cp .env .env.testing
        sed -i 's/value="sqlite"/value="mysql"/' phpunit.xml || true
        sed -i 's/value=":memory:"/value="ticaret_test"/' phpunit.xml || true
        sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env.testing
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=ticaret_test/' .env.testing
        echo "DB_HOST=127.0.0.1" >> .env.testing
        echo "DB_PORT=3306" >> .env.testing
        echo "DB_USERNAME=root" >> .env.testing
        echo "DB_PASSWORD=root" >> .env.testing

    - name: Run Database Migrations (MySQL)
      run: php artisan migrate:fresh --env=testing

    - name: Execute tests (Pest)
      run: vendor/bin/pest
